name: Code Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required files
        run: |
         test -f public/1023_git/index.html
         test -f public/1023_git/js/script.js
         test -f public/1023_git/css/style.css

      - name: Check JavaScript syntax
        run: |
         node --check public/1023_git/js/script.js